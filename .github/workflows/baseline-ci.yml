name: Baseline CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    name: baseline
    if: startsWith(github.head_ref, 'codex/pr-gate-rollback-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact compatibility head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install compatibility dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          openpyxl==3.1.5 xlrd==2.0.1 playwright==1.58.0
          pypdf==6.4.1 reportlab==4.4.5

      - name: Install compatibility browser
        run: python3 -m playwright install chromium

      - name: Validate exact diff and protocol core
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          python3 -m compileall -q apps packages ci
          python3 ci/test_planner_smoke.py
          python3 apps/github_release_runner_smoke.py
          python3 apps/production_apply_runner_smoke.py

      - name: Build exact compatibility plan
        run: >-
          python3 ci/test_planner.py
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output "$RUNNER_TEMP/test-plan.json"

      - name: Run full selected compatibility groups
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/test-plan.json" <<'PY'
          import json, subprocess, sys
          plan_path = sys.argv[1]
          plan = json.load(open(plan_path, encoding="utf-8"))
          for group in plan["groups"]:
              subprocess.run(["python3", "ci/run_test_group.py", "--plan", plan_path, "--group", group], check=True)
          PY

      - name: Parse workflow YAML
        run: >-
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each {
          |path| YAML.parse_file(path) }'
