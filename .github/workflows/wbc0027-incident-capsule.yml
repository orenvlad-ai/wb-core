name: WBC0027 Incident Recovery Capsule

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification stops at HUMAN_REQUIRED; Apply consumes that exact artifact and gate
        required: true
        type: choice
        options:
          - qualification
          - apply
      pr:
        description: Exact merged capsule release PR
        required: true
        type: number
      release_operation_id:
        description: Exact live_runtime/done Release Runner operation
        required: true
        type: string
      qualification_run_id:
        description: Exact qualification workflow run; required only for Apply
        required: false
        default: "0"
        type: string
      authorization_comment_id:
        description: Exact OWNER/MEMBER capsule authorization comment; required only for Apply
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: wbc0027-incident-capsule
  cancel-in-progress: false

jobs:
  qualification:
    if: inputs.mode == 'qualification'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main capsule workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind exact capsule release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 apps/wbc0027_incident_capsule_workflow.py release-binding
          --repository "${{ github.repository }}"
          --pr "${{ inputs.pr }}"
          --release-operation-id "${{ inputs.release_operation_id }}"
          --workflow-run-id "${{ github.run_id }}"
          --output "$RUNNER_TEMP/capsule-release-binding.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Configure canonical hosted SSH identity
        env:
          SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 0700 "$RUNNER_TEMP/capsule-ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/capsule-ssh/id"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/capsule-ssh/id"
          install -m 0600 /dev/null "$RUNNER_TEMP/capsule-ssh/known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/capsule-ssh/known_hosts"

      - name: Run deployed query-only qualification
        env:
          DEPLOYED_SHA: ${{ steps.release.outputs.deployed_sha }}
          OPERATION_ID: ${{ steps.release.outputs.operation_id }}
        run: |
          set -eu
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/capsule-ssh/known_hosts" -i "$RUNNER_TEMP/capsule-ssh/id")
          SCP=(scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/capsule-ssh/known_hosts" -i "$RUNNER_TEMP/capsule-ssh/id")
          REMOTE_EVIDENCE="/opt/wb-core-runtime/state/backups/private-evidence/production-goals/$OPERATION_ID"
          "${SSH[@]}" wb-core-eu-root "set -eu; umask 077; install -d -m 0700 '$REMOTE_EVIDENCE'"
          "${SCP[@]}" "$RUNNER_TEMP/capsule-release-binding.json" "wb-core-eu-root:$REMOTE_EVIDENCE/release-binding.json"
          "${SSH[@]}" wb-core-eu-root "set -eu; umask 077; cd /opt/wb-core-runtime/app; export PYTHONPATH=/opt/wb-core-runtime/app PYTHONDONTWRITEBYTECODE=1; python3 apps/wbc0027_incident_recovery_capsule.py --runtime-dir /opt/wb-core-runtime/state --deployed-sha '$DEPLOYED_SHA' --passport-file /opt/wb-core-runtime/app/release/production-mutations/wbc0027_fbs_lifecycle_incident.json --release-binding-file '$REMOTE_EVIDENCE/release-binding.json' --scratch-dir /tmp/wbc0027-incident-capsule-qualification qualification --operation-id '$OPERATION_ID' --evidence-dir '$REMOTE_EVIDENCE'" > "$RUNNER_TEMP/qualification-compact.json"
          test "$(jq -r .state "$RUNNER_TEMP/qualification-compact.json")" = HUMAN_REQUIRED
          test "$(jq -r .production_mutation_submit_count "$RUNNER_TEMP/qualification-compact.json")" = 0
          install -d -m 0700 "$RUNNER_TEMP/capsule-artifact"
          "${SCP[@]}" "wb-core-eu-root:$(jq -r .manifest_path "$RUNNER_TEMP/qualification-compact.json")" "$RUNNER_TEMP/capsule-artifact/capsule-manifest.json"
          "${SCP[@]}" "wb-core-eu-root:$(jq -r .backup_path "$RUNNER_TEMP/qualification-compact.json")" "$RUNNER_TEMP/capsule-artifact/capsule-backup-evidence.json"
          "${SCP[@]}" "wb-core-eu-root:$(jq -r .qualification_path "$RUNNER_TEMP/qualification-compact.json")" "$RUNNER_TEMP/capsule-artifact/capsule-qualification.json"
          cp "$RUNNER_TEMP/capsule-release-binding.json" "$RUNNER_TEMP/capsule-artifact/capsule-release-binding.json"
          cp "$RUNNER_TEMP/qualification-compact.json" "$RUNNER_TEMP/capsule-artifact/qualification-compact.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/capsule-artifact/capsule-manifest.json" | cut -d' ' -f1)" = "$(jq -r .manifest_sha256 "$RUNNER_TEMP/qualification-compact.json")"
          test "sha256:$(sha256sum "$RUNNER_TEMP/capsule-artifact/capsule-qualification.json" | cut -d' ' -f1)" = "$(jq -r .qualification_sha256 "$RUNNER_TEMP/qualification-compact.json")"

      - name: Upload immutable qualification artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: wbc0027-incident-capsule-pr-${{ inputs.pr }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/capsule-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Record HUMAN_REQUIRED handoff without Apply marker
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -eu
          jq -n \
            --arg state HUMAN_REQUIRED \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg manifest_digest "$(jq -r .manifest_digest "$RUNNER_TEMP/qualification-compact.json")" \
            --arg qualification_digest "$(jq -r .qualification_digest "$RUNNER_TEMP/qualification-compact.json")" \
            --argjson submit_count 0 \
            '{state:$state,artifact_id:($artifact_id|tonumber),artifact_digest:$artifact_digest,manifest_digest:$manifest_digest,qualification_digest:$qualification_digest,production_mutation_submit_count:$submit_count,github_apply_marker_published:false}' > "$RUNNER_TEMP/human-required.json"
          cat "$RUNNER_TEMP/human-required.json"

  apply:
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted main capsule workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reject missing Apply bindings
        run: |
          set -eu
          test "${{ inputs.qualification_run_id }}" -gt 0
          test "${{ inputs.authorization_comment_id }}" -gt 0

      - name: Bind exact capsule release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 apps/wbc0027_incident_capsule_workflow.py release-binding
          --repository "${{ github.repository }}"
          --pr "${{ inputs.pr }}"
          --release-operation-id "${{ inputs.release_operation_id }}"
          --workflow-run-id "${{ github.run_id }}"
          --output "$RUNNER_TEMP/capsule-release-binding.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: wbc0027-incident-capsule-pr-${{ inputs.pr }}-run-${{ inputs.qualification_run_id }}
          path: ${{ runner.temp }}/qualification-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Validate the single human gate
        id: authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 apps/wbc0027_incident_capsule_workflow.py validate-authorization
          --repository "${{ github.repository }}"
          --authorization-comment-id "${{ inputs.authorization_comment_id }}"
          --release-binding-file "$RUNNER_TEMP/capsule-release-binding.json"
          --manifest-file "$RUNNER_TEMP/qualification-artifact/capsule-manifest.json"
          --qualification-file "$RUNNER_TEMP/qualification-artifact/capsule-qualification.json"
          --output "$RUNNER_TEMP/capsule-authorization.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Configure canonical hosted SSH identity
        env:
          SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 0700 "$RUNNER_TEMP/capsule-ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/capsule-ssh/id"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/capsule-ssh/id"
          install -m 0600 /dev/null "$RUNNER_TEMP/capsule-ssh/known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/capsule-ssh/known_hosts"

      - name: Submit once, then query-only readback
        id: submit
        env:
          DEPLOYED_SHA: ${{ steps.release.outputs.deployed_sha }}
          OPERATION_ID: ${{ steps.authorization.outputs.operation_id }}
        run: |
          set -eu
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/capsule-ssh/known_hosts" -i "$RUNNER_TEMP/capsule-ssh/id")
          SCP=(scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/capsule-ssh/known_hosts" -i "$RUNNER_TEMP/capsule-ssh/id")
          REMOTE_EVIDENCE="/opt/wb-core-runtime/state/backups/private-evidence/production-goals/$OPERATION_ID-apply"
          "${SSH[@]}" wb-core-eu-root "set -eu; umask 077; install -d -m 0700 '$REMOTE_EVIDENCE'"
          "${SCP[@]}" "$RUNNER_TEMP/capsule-release-binding.json" "wb-core-eu-root:$REMOTE_EVIDENCE/release-binding.json"
          "${SCP[@]}" "$RUNNER_TEMP/qualification-artifact/capsule-manifest.json" "wb-core-eu-root:$REMOTE_EVIDENCE/capsule-manifest.json"
          "${SCP[@]}" "$RUNNER_TEMP/qualification-artifact/capsule-qualification.json" "wb-core-eu-root:$REMOTE_EVIDENCE/capsule-qualification.json"
          "${SCP[@]}" "$RUNNER_TEMP/capsule-authorization.json" "wb-core-eu-root:$REMOTE_EVIDENCE/capsule-authorization.json"
          set +e
          "${SSH[@]}" wb-core-eu-root "set -eu; umask 077; cd /opt/wb-core-runtime/app; export PYTHONPATH=/opt/wb-core-runtime/app PYTHONDONTWRITEBYTECODE=1; AUTH=\$(jq -r .body '$REMOTE_EVIDENCE/capsule-authorization.json'); python3 apps/wbc0027_incident_recovery_capsule.py --runtime-dir /opt/wb-core-runtime/state --deployed-sha '$DEPLOYED_SHA' --passport-file /opt/wb-core-runtime/app/release/production-mutations/wbc0027_fbs_lifecycle_incident.json --release-binding-file '$REMOTE_EVIDENCE/release-binding.json' --output '$REMOTE_EVIDENCE/apply-result.json' apply --manifest-file '$REMOTE_EVIDENCE/capsule-manifest.json' --qualification-file '$REMOTE_EVIDENCE/capsule-qualification.json' --operation-id '$OPERATION_ID' --approval-reference \"\$AUTH\" --actor production-apply-runner --evidence-dir '$REMOTE_EVIDENCE'"
          APPLY_RC=$?
          set -e
          set +e
          "${SSH[@]}" wb-core-eu-root "set -eu; umask 077; cd /opt/wb-core-runtime/app; export PYTHONPATH=/opt/wb-core-runtime/app PYTHONDONTWRITEBYTECODE=1; AUTH=\$(jq -r .body '$REMOTE_EVIDENCE/capsule-authorization.json'); python3 apps/wbc0027_incident_recovery_capsule.py --runtime-dir /opt/wb-core-runtime/state --deployed-sha '$DEPLOYED_SHA' --passport-file /opt/wb-core-runtime/app/release/production-mutations/wbc0027_fbs_lifecycle_incident.json --release-binding-file '$REMOTE_EVIDENCE/release-binding.json' --output '$REMOTE_EVIDENCE/readback.json' readback --manifest-file '$REMOTE_EVIDENCE/capsule-manifest.json' --operation-id '$OPERATION_ID' --approval-reference \"\$AUTH\""
          READBACK_RC=$?
          set -e
          install -d -m 0700 "$RUNNER_TEMP/apply-artifact"
          "${SCP[@]}" "wb-core-eu-root:$REMOTE_EVIDENCE/readback.json" "$RUNNER_TEMP/apply-artifact/readback.json" || true
          "${SCP[@]}" "wb-core-eu-root:$REMOTE_EVIDENCE/apply-result.json" "$RUNNER_TEMP/apply-artifact/apply-result.json" || true
          cp "$RUNNER_TEMP/capsule-release-binding.json" "$RUNNER_TEMP/apply-artifact/release-binding.json"
          cp "$RUNNER_TEMP/capsule-authorization.json" "$RUNNER_TEMP/apply-artifact/authorization.json"
          cp "$RUNNER_TEMP/qualification-artifact/capsule-manifest.json" "$RUNNER_TEMP/apply-artifact/capsule-manifest.json"
          jq -n --argjson apply_rc "$APPLY_RC" --argjson readback_rc "$READBACK_RC" --arg state "$(jq -r '.state // "blocked"' "$RUNNER_TEMP/apply-artifact/readback.json" 2>/dev/null || printf blocked)" '{state:$state,apply_command_count:1,apply_return_code:$apply_rc,query_only_readback_count:1,readback_return_code:$readback_rc,blind_retry_count:0}' > "$RUNNER_TEMP/apply-artifact/terminal.json"
          echo "terminal_state=$(jq -r .state "$RUNNER_TEMP/apply-artifact/terminal.json")" >> "$GITHUB_OUTPUT"

      - name: Upload terminal receipt before comment
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: wbc0027-incident-capsule-apply-pr-${{ inputs.pr }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/apply-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Publish one compact terminal marker
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          TERMINAL_STATE: ${{ steps.submit.outputs.terminal_state }}
        run: |
          set -eu
          BODY="<!-- wb-core-wbc0027-incident-capsule operation=${{ steps.authorization.outputs.operation_id }} -->
          WBC0027 incident capsule terminal receipt (artifact first).
          \`\`\`json
          {\"state\":\"$TERMINAL_STATE\",\"operation_id\":\"${{ steps.authorization.outputs.operation_id }}\",\"apply_command_count\":1,\"blind_retry_count\":0,\"artifact_id\":$ARTIFACT_ID,\"artifact_digest\":\"$ARTIFACT_DIGEST\"}
          \`\`\`"
          gh api --method POST "repos/${{ github.repository }}/issues/${{ inputs.pr }}/comments" -f body="$BODY"
          test "$TERMINAL_STATE" = done
