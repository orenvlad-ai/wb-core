name: WBC Transition Validator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/pr-gate.yml
      - .github/workflows/release-runner.yml
      - apps/github_release_runner.py

permissions:
  contents: read

jobs:
  validate:
    name: transition-validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base validator
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Detect installed base validator
        id: installed
        shell: bash
        run: |
          if [[ -f trusted-base/ci/wbc_transition_validator.py ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate protected boundary from trusted base
        if: steps.installed.outputs.enabled == 'true'
        run: >-
          python3 trusted-base/ci/wbc_transition_validator.py
          --root candidate
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output "$RUNNER_TEMP/wbc-transition-receipt.json"
      - name: Upload bound transition receipt
        if: steps.installed.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wbc-transition-validator-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/wbc-transition-receipt.json
          if-no-files-found: error
          retention-days: 30
