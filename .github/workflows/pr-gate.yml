name: PR Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Diagnostic PR number; this run cannot satisfy required PR provenance
        required: true
        type: number
      base_sha:
        description: Exact diagnostic base SHA
        required: true
        type: string
      head_sha:
        description: Exact diagnostic head SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  core:
    name: Fast core checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact event bindings
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr="${{ github.event.pull_request.number }}"
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            pr="${{ inputs.pr_number }}"
            base="${{ inputs.base_sha }}"
            head="${{ inputs.head_sha }}"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Checkout proposed change
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize exact proposed head
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.meta.outputs.pr }}"
          head="${{ steps.meta.outputs.head }}"
          fetched_ref="refs/remotes/origin/pr-gate-head"
          git fetch --no-tags --no-recurse-submodules origin "+refs/pull/$pr/head:$fetched_ref"
          resolved_head="$(git rev-parse "$fetched_ref^{commit}")"
          if [[ "$resolved_head" != "$head" ]]; then
            echo "pull ref head mismatch: expected $head, got $resolved_head" >&2
            exit 1
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          git submodule foreach --quiet --recursive 'git config --local --unset-all http.https://github.com/.extraheader || true'
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "checkout credential remained before candidate execution" >&2
            exit 1
          fi
          git submodule foreach --quiet --recursive 'if git config --local --get-regexp "^http\\..*\\.extraheader$" >/dev/null; then exit 1; fi'
          git checkout --detach "$resolved_head"
          checked_head="$(git rev-parse HEAD)"
          if [[ "$checked_head" != "$head" ]]; then
            echo "proposed head checkout mismatch: expected $head, got $checked_head" >&2
            exit 1
          fi

      - name: Validate exact diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ steps.meta.outputs.base }}...${{ steps.meta.outputs.head }}"

      - name: Validate syntax and deterministic protocol core
        run: |
          python3 -m compileall -q apps packages ci
          python3 ci/test_planner_smoke.py
          python3 apps/github_release_runner_smoke.py
          python3 apps/production_apply_runner_smoke.py

      - name: Parse workflow YAML
        run: >-
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each {
          |path| YAML.parse_file(path) }'

  plan:
    name: Deterministic impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      browser_groups: ${{ steps.plan.outputs.browser_groups }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      plan_valid: ${{ steps.plan.outputs.plan_valid }}
      execution_valid: ${{ steps.plan.outputs.execution_valid }}
      release_valid: ${{ steps.plan.outputs.release_valid }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      pr: ${{ steps.meta.outputs.pr }}
      base_sha: ${{ steps.meta.outputs.base }}
      head_sha: ${{ steps.meta.outputs.head }}
    steps:
      - name: Resolve exact event bindings
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr="${{ github.event.pull_request.number }}"
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            pr="${{ inputs.pr_number }}"
            base="${{ inputs.base_sha }}"
            head="${{ inputs.head_sha }}"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "artifact_name=test-plan-$pr-$head" >> "$GITHUB_OUTPUT"

      # Canonical plan semantics come only from the exact trusted PR base. The
      # head is materialized as a Git object for registry/diff reads; no head
      # Python, workflow helper, or import path is executed in this job.
      - name: Checkout trusted exact PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.base }}
          fetch-depth: 0

      - name: Materialize exact head objects read-only
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.meta.outputs.pr }}"
          base="${{ steps.meta.outputs.base }}"
          head="${{ steps.meta.outputs.head }}"
          checked_base="$(git rev-parse HEAD)"
          if [[ "$checked_base" != "$base" ]]; then
            echo "trusted base checkout mismatch: expected $base, got $checked_base" >&2
            exit 1
          fi
          fetched_ref="refs/remotes/origin/pr-plan-head"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/$pr/head:$fetched_ref"
          resolved_head="$(git rev-parse "$fetched_ref^{commit}")"
          if [[ "$resolved_head" != "$head" ]]; then
            echo "pull ref head mismatch: expected $head, got $resolved_head" >&2
            exit 1
          fi
          git cat-file -e "$head^{commit}"
          if [[ "$(git rev-parse HEAD)" != "$base" ]]; then
            echo "trusted base moved while materializing head objects" >&2
            exit 1
          fi

      - name: Build canonical test plan
        id: plan
        run: >-
          env -u PYTHONHOME -u PYTHONPATH /usr/bin/python3 -I ci/test_planner.py
          --pr "${{ steps.meta.outputs.pr }}"
          --base "${{ steps.meta.outputs.base }}"
          --head "${{ steps.meta.outputs.head }}"
          --output "$RUNNER_TEMP/test-plan.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable test plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/test-plan.json
          if-no-files-found: error
          retention-days: 30

  selected:
    name: Selected group · ${{ matrix.group }}
    needs:
      - plan
    if: needs.plan.outputs.execution_valid == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bind selected tests to exact proposed head
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ needs.plan.outputs.pr }}"
          head="${{ needs.plan.outputs.head_sha }}"
          base="${{ needs.plan.outputs.base_sha }}"
          fetched_ref="refs/remotes/origin/pr-selected-head"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/$pr/head:$fetched_ref"
          resolved_head="$(git rev-parse "$fetched_ref^{commit}")"
          if [[ "$resolved_head" != "$head" ]]; then
            echo "pull ref head mismatch: expected $head, got $resolved_head" >&2
            exit 1
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          git submodule foreach --quiet --recursive 'git config --local --unset-all http.https://github.com/.extraheader || true'
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "checkout credential remained before candidate execution" >&2
            exit 1
          fi
          git submodule foreach --quiet --recursive 'if git config --local --get-regexp "^http\\..*\\.extraheader$" >/dev/null; then exit 1; fi'
          git checkout --detach "$resolved_head"
          if [[ "$(git rev-parse HEAD)" != "$head" ]]; then
            echo "selected test checkout mismatch" >&2
            exit 1
          fi
          trusted_harness="$RUNNER_TEMP/trusted-base-harness"
          git worktree add --detach "$trusted_harness" "$base"
          if [[ "$(git -C "$trusted_harness" rev-parse HEAD)" != "$base" ]]; then
            echo "trusted harness checkout mismatch" >&2
            exit 1
          fi
          if git -C "$trusted_harness" config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "trusted harness checkout retained a credential" >&2
            exit 1
          fi
          git -C "$trusted_harness" submodule foreach --quiet --recursive 'if git config --local --get-regexp "^http\\..*\\.extraheader$" >/dev/null; then exit 1; fi'

      - name: Download immutable test plan
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ${{ runner.temp }}/plan

      - name: Install selected suite dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          openpyxl==3.1.5 xlrd==2.0.1 playwright==1.58.0
          pypdf==6.4.1 reportlab==4.4.5

      - name: Install browser for browser group
        if: contains(fromJSON(needs.plan.outputs.browser_groups), matrix.group)
        run: python3 -m playwright install chromium

      - name: Run exact selected group
        run: >-
          env -u PYTHONHOME -u PYTHONPATH /usr/bin/python3 -I
          "$RUNNER_TEMP/trusted-base-harness/ci/run_test_group.py"
          --plan "$RUNNER_TEMP/plan/test-plan.json"
          --group "${{ matrix.group }}"

  pr_gate:
    name: ${{ github.event_name == 'pull_request' && 'pr-gate' || 'pr-gate-diagnostic' }}
    needs:
      - core
      - plan
      - selected
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate exact PR provenance and selected results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CORE_RESULT: ${{ needs.core.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_RESULT: ${{ needs.selected.result }}
          PLAN_VALID: ${{ needs.plan.outputs.plan_valid }}
          EXECUTION_VALID: ${{ needs.plan.outputs.execution_valid }}
          RELEASE_VALID: ${{ needs.plan.outputs.release_valid }}
        run: |
          python3 - <<'PY'
          import os
          expected = {
              "CORE_RESULT": "success",
              "PLAN_RESULT": "success",
              "SELECTED_RESULT": "success",
              "PLAN_VALID": "true",
              "EXECUTION_VALID": "true",
              "RELEASE_VALID": "true",
          }
          mismatches = {key: (os.environ.get(key), value) for key, value in expected.items() if os.environ.get(key) != value}
          if mismatches:
              raise SystemExit(f"PR Gate aggregate failed: {mismatches}")
          if os.environ["EVENT_NAME"] not in {"pull_request", "workflow_dispatch"}:
              raise SystemExit("unsupported PR Gate provenance")
          PY
