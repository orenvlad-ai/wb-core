name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact diff and workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |p| YAML.parse_file(p) }'

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      base: ${{ steps.meta.outputs.base }}
      head: ${{ steps.meta.outputs.head }}
    steps:
      - name: Checkout trusted base selector
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind candidate objects
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pr="${{ github.event.pull_request.number }}"
          test "$(git rev-parse HEAD)" = "$base"
          git fetch --no-tags --no-recurse-submodules origin "+refs/pull/$pr/head:refs/remotes/origin/check-head"
          test "$(git rev-parse refs/remotes/origin/check-head^{commit})" = "$head"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "artifact=check-plan-$pr-$head" >> "$GITHUB_OUTPUT"
      - name: Select proportional checks
        run: >-
          python3 -I ci/select_checks.py
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ steps.meta.outputs.base }}"
          --head "${{ steps.meta.outputs.head }}"
          --output "$RUNNER_TEMP/check-plan.json"
      - name: Upload bound plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ runner.temp }}/check-plan.json
          if-no-files-found: error
          retention-days: 30

  checks:
    name: Checks
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
          path: candidate
          persist-credentials: false
      - name: Download bound plan
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: plan
      - name: Install only selected dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages="$(python3 -c 'import json; print(" ".join(json.load(open("plan/check-plan.json"))["pip"]))')"
          if [[ -n "$packages" ]]; then
            python3 -m pip install --disable-pip-version-check $packages
          fi
      - name: Run selected checks with trusted harness
        run: >-
          python3 trusted-base/ci/run_checks.py
          --root candidate
          --plan plan/check-plan.json

  gate:
    name: pr-gate
    if: always()
    needs: [core, plan, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every part
        env:
          CORE: ${{ needs.core.result }}
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          test "$CORE" = success
          test "$PLAN" = success
          test "$CHECKS" = success
