name: Release Train

on:
  pull_request_target:
    types:
      - labeled
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wb-core-production-release
  queue: max

permissions:
  actions: write
  checks: read
  contents: write
  deployments: write
  issues: write
  pull-requests: write

jobs:
  select:
    name: Select queued PR
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.label.name == 'release:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      found: ${{ steps.select.outputs.found }}
      halted: ${{ steps.select.outputs.halted }}
      halted_pr_number: ${{ steps.select.outputs.halted_pr_number }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      scope: ${{ steps.select.outputs.scope }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure release labels
        run: python3 apps/github_release_train.py setup-labels

      - name: Select oldest ready PR
        id: select
        run: python3 apps/github_release_train.py select --output-path "$GITHUB_OUTPUT"

      - name: Refuse releases after production failure
        if: steps.select.outputs.halted == 'true'
        run: |
          echo "Release Train is halted by PR #${{ steps.select.outputs.halted_pr_number }}."
          exit 1

      - name: Report empty queue
        if: steps.select.outputs.found != 'true' && steps.select.outputs.halted != 'true'
        run: echo "No release:ready pull requests."

  prepare:
    name: Prepare queued PR
    needs: select
    if: needs.select.outputs.found == 'true' && needs.select.outputs.halted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      head_ref: ${{ steps.prepare.outputs.head_ref }}
      scope: ${{ steps.prepare.outputs.scope }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PR against current main
        id: prepare
        run: >-
          python3 apps/github_release_train.py prepare
          --pr "${{ needs.select.outputs.pr_number }}"
          --check-name baseline
          --output-path "$GITHUB_OUTPUT"

  release_repo_only:
    name: Merge repo-only PR
    needs:
      - select
      - prepare
    if: needs.prepare.outputs.scope == 'scope:repo-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Merge exact checked PR head
        id: merge
        run: >-
          python3 apps/github_release_train.py merge
          --pr "${{ needs.select.outputs.pr_number }}"
          --expected-head-sha "${{ needs.prepare.outputs.head_sha }}"
          --head-ref "${{ needs.prepare.outputs.head_ref }}"
          --scope "${{ needs.prepare.outputs.scope }}"
          --output-path "$GITHUB_OUTPUT"

      - name: Mark repo-only completion
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:done
          --comment "Release Train смёржил repo-only PR как \`${{ steps.merge.outputs.merge_sha }}\`; deploy не применялся."

      - name: Delete merged feature branch
        continue-on-error: true
        run: >-
          python3 apps/github_release_train.py cleanup-branch
          --pr "${{ needs.select.outputs.pr_number }}"

      - name: Mark merge blocker
        if: failure() && steps.merge.outputs.merge_sha == ''
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:blocked

      - name: Continue release queue
        run: python3 apps/github_release_train.py dispatch-next

  release_live:
    name: Merge and deploy live PR
    needs:
      - select
      - prepare
    if: needs.prepare.outputs.scope == 'scope:live-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_DEPLOY_SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
      WB_CORE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check production secret binding
        run: >-
          python3 apps/github_release_train.py preflight-deploy
          --pr "${{ needs.select.outputs.pr_number }}"

      - name: Configure production SSH
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/wb-core-release-key"
          known_hosts_file="$RUNNER_TEMP/wb-core-known-hosts"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$WB_CORE_DEPLOY_SSH_KEY" > "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$WB_CORE_DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          install -d -m 700 "$HOME/.ssh"
          target_host="$(python3 -c 'import json; print(json.load(open("artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json"))["host_ip"])')"
          target_alias="$(python3 -c 'import json; print(json.load(open("artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json"))["ssh_destination"])')"
          config_file="$HOME/.ssh/config"
          install -m 600 /dev/null "$config_file"
          printf 'Host %s\n  HostName %s\n  User root\n  IdentityFile %s\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s\n' \
            "$target_alias" "$target_host" "$key_file" "$known_hosts_file" > "$config_file"
          echo "WB_CORE_RELEASE_SSH_ALIAS=$target_alias" >> "$GITHUB_ENV"

      - name: Verify production SSH before merge
        run: ssh "$WB_CORE_RELEASE_SSH_ALIAS" true

      - name: Merge exact checked PR head
        id: merge
        run: >-
          python3 apps/github_release_train.py merge
          --pr "${{ needs.select.outputs.pr_number }}"
          --expected-head-sha "${{ needs.prepare.outputs.head_sha }}"
          --head-ref "${{ needs.prepare.outputs.head_ref }}"
          --scope "${{ needs.prepare.outputs.scope }}"
          --output-path "$GITHUB_OUTPUT"

      - name: Checkout exact merge SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.merge.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install deploy-runner dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          openpyxl==3.1.5 xlrd==2.0.1 playwright==1.58.0
          pypdf==6.4.1 reportlab==4.4.5

      - name: Deploy and verify exact merge SHA
        run: python3 apps/registry_upload_http_entrypoint_hosted_runtime.py deploy-and-verify

      - name: Mark production completion
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:production
          --comment "Release Train задеплоил и проверил production merge SHA \`${{ steps.merge.outputs.merge_sha }}\`."

      - name: Delete merged feature branch
        continue-on-error: true
        run: >-
          python3 apps/github_release_train.py cleanup-branch
          --pr "${{ needs.select.outputs.pr_number }}"

      - name: Mark pre-merge blocker
        if: failure() && steps.merge.outputs.merge_sha == ''
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:blocked

      - name: Halt queue after merged release failure
        if: failure() && steps.merge.outputs.merge_sha != ''
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:halted
          --comment "Release Train остановил всю очередь: PR уже смёржен, но deploy или production verify не завершился успешно."

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wb-core-release-key" "$RUNNER_TEMP/wb-core-known-hosts" "$HOME/.ssh/config"

      - name: Continue release queue
        run: python3 apps/github_release_train.py dispatch-next
