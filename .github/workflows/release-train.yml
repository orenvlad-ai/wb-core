name: Release Train

on:
  pull_request_target:
    types:
      - labeled
  issue_comment:
    types:
      - created
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reconcile_pr:
        description: "Merged release:halted PR to reconcile; omit for normal queue dispatch"
        required: false
        type: string
      expected_head_sha:
        description: "Exact pre-merge PR head for reconciliation"
        required: false
        type: string
      expected_merge_sha:
        description: "Exact deployed merge SHA for reconciliation"
        required: false
        type: string

concurrency:
  group: wb-core-production-release
  queue: max

permissions:
  actions: write
  checks: read
  contents: write
  deployments: write
  issues: write
  pull-requests: write

jobs:
  finance_lease_command:
    name: Apply global Finance migration deploy lease command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/wb-core finance-lease ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_DEPLOY_SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
      WB_CORE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
      FINANCE_LEASE_COMMAND: ${{ github.event.comment.body }}
      FINANCE_LEASE_ACTOR: ${{ github.event.comment.user.login }}
      FINANCE_LEASE_ASSOCIATION: ${{ github.event.comment.author_association }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure Finance lease labels
        run: python3 apps/github_release_train.py setup-labels

      - name: Validate exact Finance lease identity and transition
        id: preflight
        run: >-
          python3 apps/github_release_train.py preflight-finance-lease
          --pr "${{ github.event.issue.number }}"
          --command "$FINANCE_LEASE_COMMAND"
          --actor "$FINANCE_LEASE_ACTOR"
          --association "$FINANCE_LEASE_ASSOCIATION"
          --output-path "$GITHUB_OUTPUT"

      - name: Configure canonical production SSH
        if: steps.preflight.outputs.needs_deploy_readback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/wb-core-release-key"
          known_hosts_file="$RUNNER_TEMP/wb-core-known-hosts"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$WB_CORE_DEPLOY_SSH_KEY" > "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$WB_CORE_DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          install -d -m 700 "$HOME/.ssh"
          target_file="artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json"
          target_host="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["host_ip"])' "$target_file")"
          target_alias="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_destination"])' "$target_file")"
          config_file="$HOME/.ssh/config"
          install -m 600 /dev/null "$config_file"
          printf 'Host %s\n  HostName %s\n  User root\n  IdentityFile %s\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s\n' \
            "$target_alias" "$target_host" "$key_file" "$known_hosts_file" > "$config_file"

      - name: Install deployment readback dependencies
        if: steps.preflight.outputs.needs_deploy_readback == 'true'
        run: >-
          python3 -m pip install --disable-pip-version-check
          openpyxl==3.1.5 xlrd==2.0.1 playwright==1.58.0
          pypdf==6.4.1 reportlab==4.4.5

      - name: Read canonical deployed SHA
        if: steps.preflight.outputs.needs_deploy_readback == 'true'
        run: >-
          python3 apps/hosted_runtime_transport_reconcile.py
          --target-file artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json
          --expected-sha "${{ steps.preflight.outputs.deployed_sha }}"
          --pr "${{ github.event.issue.number }}"
          --head "${{ steps.preflight.outputs.head_sha }}"
          --merge "${{ steps.preflight.outputs.deployed_sha }}"
          --failed-stage readback
          --read-only
          --output "$RUNNER_TEMP/wb-core-finance-lease-deploy.json"

      - name: Apply Actions-owned Finance lease transition
        shell: bash
        run: |
          set -euo pipefail
          args=(
            python3 apps/github_release_train.py handle-finance-lease
            --pr "${{ github.event.issue.number }}"
            --command "$FINANCE_LEASE_COMMAND"
            --actor "$FINANCE_LEASE_ACTOR"
            --association "$FINANCE_LEASE_ASSOCIATION"
          )
          if [[ "${{ steps.preflight.outputs.needs_deploy_readback }}" == "true" ]]; then
            args+=(--deploy-evidence-file "$RUNNER_TEMP/wb-core-finance-lease-deploy.json")
          fi
          "${args[@]}"

      - name: Remove temporary Finance lease material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wb-core-release-key" "$RUNNER_TEMP/wb-core-known-hosts" \
            "$RUNNER_TEMP/wb-core-finance-lease-deploy.json" "$HOME/.ssh/config"

  production_mutation_command:
    name: Validate human-gated production-mutation terminalization
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/wb-core production-mutation complete ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.preflight.outputs.head_sha }}
      merge_sha: ${{ steps.preflight.outputs.merge_sha }}
      deployed_sha: ${{ steps.preflight.outputs.deployed_sha }}
      already_completed: ${{ steps.preflight.outputs.already_completed }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MUTATION_COMMAND: ${{ github.event.comment.body }}
      MUTATION_ACTOR: ${{ github.event.comment.user.login }}
      MUTATION_ASSOCIATION: ${{ github.event.comment.author_association }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact PR, gate and reconciliation evidence
        id: preflight
        run: >-
          python3 apps/github_release_train.py preflight-production-mutation
          --pr "${{ github.event.issue.number }}"
          --command "$MUTATION_COMMAND"
          --actor "$MUTATION_ACTOR"
          --association "$MUTATION_ASSOCIATION"
          --output-path "$GITHUB_OUTPUT"

      - name: Re-dispatch queue after repeated proven terminalization
        if: steps.preflight.outputs.already_completed == 'true'
        run: python3 apps/github_release_train.py dispatch-next

  terminalize_production_mutation:
    name: Verify deploy and terminalize production mutation
    needs: production_mutation_command
    if: needs.production_mutation_command.outputs.already_completed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_DEPLOY_SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
      WB_CORE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
      MUTATION_COMMAND: ${{ github.event.comment.body }}
      MUTATION_ACTOR: ${{ github.event.comment.user.login }}
      MUTATION_ASSOCIATION: ${{ github.event.comment.author_association }}
    steps:
      - name: Checkout trusted main terminalizer
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure canonical production SSH
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/wb-core-release-key"
          known_hosts_file="$RUNNER_TEMP/wb-core-known-hosts"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$WB_CORE_DEPLOY_SSH_KEY" > "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$WB_CORE_DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          install -d -m 700 "$HOME/.ssh"
          target_file="artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json"
          target_host="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["host_ip"])' "$target_file")"
          target_alias="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_destination"])' "$target_file")"
          config_file="$HOME/.ssh/config"
          install -m 600 /dev/null "$config_file"
          printf 'Host %s\n  HostName %s\n  User root\n  IdentityFile %s\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s\n' \
            "$target_alias" "$target_host" "$key_file" "$known_hosts_file" > "$config_file"

      - name: Install deployment evidence dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          openpyxl==3.1.5 xlrd==2.0.1 playwright==1.58.0
          pypdf==6.4.1 reportlab==4.4.5

      - name: Read canonical deployed SHA evidence
        run: >-
          python3 apps/hosted_runtime_transport_reconcile.py
          --target-file artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json
          --expected-sha "${{ needs.production_mutation_command.outputs.deployed_sha }}"
          --pr "${{ github.event.issue.number }}"
          --head "${{ needs.production_mutation_command.outputs.head_sha }}"
          --merge "${{ needs.production_mutation_command.outputs.deployed_sha }}"
          --failed-stage readback
          --read-only
          --output "$RUNNER_TEMP/wb-core-production-mutation-deploy.json"

      - name: Apply Actions-owned exact-evidence terminal transition
        run: >-
          python3 apps/github_release_train.py handle-comment
          --pr "${{ github.event.issue.number }}"
          --command "$MUTATION_COMMAND"
          --actor "$MUTATION_ACTOR"
          --association "$MUTATION_ASSOCIATION"
          --deploy-evidence-file "$RUNNER_TEMP/wb-core-production-mutation-deploy.json"

      - name: Remove temporary terminalization material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wb-core-release-key" "$RUNNER_TEMP/wb-core-known-hosts" \
            "$RUNNER_TEMP/wb-core-production-mutation-deploy.json" "$HOME/.ssh/config"

  reconcile_halted:
    name: Reconcile exact-SHA halted release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.reconcile_pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_DEPLOY_SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
      WB_CORE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout trusted main reconciler
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure canonical production SSH
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/wb-core-release-key"
          known_hosts_file="$RUNNER_TEMP/wb-core-known-hosts"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$WB_CORE_DEPLOY_SSH_KEY" > "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$WB_CORE_DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          install -d -m 700 "$HOME/.ssh"
          target_file="artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json"
          target_host="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["host_ip"])' "$target_file")"
          target_alias="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_destination"])' "$target_file")"
          config_file="$HOME/.ssh/config"
          install -m 600 /dev/null "$config_file"
          printf 'Host %s\n  HostName %s\n  User root\n  IdentityFile %s\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s\n' \
            "$target_alias" "$target_host" "$key_file" "$known_hosts_file" > "$config_file"

      - name: Install reconciliation runner dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          openpyxl==3.1.5 xlrd==2.0.1 playwright==1.58.0
          pypdf==6.4.1 reportlab==4.4.5

      - name: Reconcile bounded exact-SHA evidence
        run: >-
          python3 apps/hosted_runtime_transport_reconcile.py
          --target-file artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json
          --expected-sha "${{ inputs.expected_merge_sha }}"
          --pr "${{ inputs.reconcile_pr }}"
          --head "${{ inputs.expected_head_sha }}"
          --merge "${{ inputs.expected_merge_sha }}"
          --failed-stage readback
          --output "$RUNNER_TEMP/wb-core-reconcile.json"

      - name: Apply evidence-bound halted transition
        run: >-
          python3 apps/github_release_train.py resume-halted
          --pr "${{ inputs.reconcile_pr }}"
          --evidence-file "$RUNNER_TEMP/wb-core-reconcile.json"

      - name: Remove temporary reconciliation material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wb-core-release-key" "$RUNNER_TEMP/wb-core-known-hosts" \
            "$RUNNER_TEMP/wb-core-reconcile.json" "$HOME/.ssh/config"

      - name: Continue queue after healthy reconciliation
        if: success()
        run: python3 apps/github_release_train.py dispatch-next

  select:
    name: Select queued PR
    if: >-
      github.event_name != 'issue_comment' &&
      (github.event_name != 'workflow_dispatch' || inputs.reconcile_pr == '') &&
      (github.event_name != 'pull_request_target' ||
      github.event.label.name == 'release:ready')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.select.outputs.status }}
      found: ${{ steps.select.outputs.found }}
      halted: ${{ steps.select.outputs.halted }}
      gate_conflict: ${{ steps.select.outputs.gate_conflict }}
      needs_resume: ${{ steps.select.outputs.needs_resume }}
      halted_pr_number: ${{ steps.select.outputs.halted_pr_number }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      scope: ${{ steps.select.outputs.scope }}
      task_class: ${{ steps.select.outputs.task_class }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_RELEASE_NEEDS_RESUME_AFTER_MINUTES: ${{ vars.WB_CORE_RELEASE_NEEDS_RESUME_AFTER_MINUTES }}
      WB_CORE_ORCHESTRATION_REQUIRED: ${{ vars.WB_CORE_ORCHESTRATION_REQUIRED }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure release labels
        run: python3 apps/github_release_train.py setup-labels

      - name: Select oldest ready PR
        id: select
        run: python3 apps/github_release_train.py select --output-path "$GITHUB_OUTPUT"

      - name: Refuse releases after production failure
        if: steps.select.outputs.halted == 'true'
        run: |
          echo "Release Train is halted by PR #${{ steps.select.outputs.halted_pr_number }}."
          exit 1

      - name: Refuse conflicting exclusive gates
        if: steps.select.outputs.gate_conflict == 'true'
        run: |
          echo "Release Train found conflicting exclusive LOOP gates."
          exit 1

      - name: Report empty queue
        if: >-
          steps.select.outputs.found != 'true' &&
          steps.select.outputs.halted != 'true' &&
          steps.select.outputs.gate_conflict != 'true'
        run: echo "Release Train is idle in state ${{ steps.select.outputs.status }}."

  prepare:
    name: Prepare queued PR
    needs: select
    if: needs.select.outputs.found == 'true' && needs.select.outputs.halted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      head_ref: ${{ steps.prepare.outputs.head_ref }}
      scope: ${{ steps.prepare.outputs.scope }}
      task_class: ${{ steps.prepare.outputs.task_class }}
      loop_root: ${{ steps.prepare.outputs.loop_root }}
      agent_acknowledged: ${{ steps.prepare.outputs.agent_acknowledged }}
      dcp_handoff: ${{ steps.prepare.outputs.dcp_handoff }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_ORCHESTRATION_REQUIRED: ${{ vars.WB_CORE_ORCHESTRATION_REQUIRED }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PR against current main
        id: prepare
        continue-on-error: true
        run: >-
          python3 apps/github_release_train.py prepare
          --pr "${{ needs.select.outputs.pr_number }}"
          --check-name baseline
          --output-path "$GITHUB_OUTPUT"

      - name: Continue queue after DCP exact-head readmission
        if: steps.prepare.outputs.readmission_required == 'true'
        run: python3 apps/github_release_train.py dispatch-next

      - name: Mark unexpected prepare failure
        if: steps.prepare.outcome == 'failure'
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:blocked

      - name: Continue queue after prepare blocker
        if: steps.prepare.outcome == 'failure'
        run: python3 apps/github_release_train.py dispatch-next

      - name: Fail prepare job after durable blocker
        if: steps.prepare.outcome == 'failure'
        run: exit 1

  await_loop_agent:
    name: Wait for active LOOP agent
    needs:
      - select
      - prepare
    if: >-
      needs.prepare.outputs.task_class == 'task:loop' &&
      needs.prepare.outputs.agent_acknowledged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Open exact-head acknowledgement gate
        id: request_agent
        continue-on-error: true
        run: >-
          python3 apps/github_release_train.py request-agent
          --pr "${{ needs.select.outputs.pr_number }}"
          --expected-head-sha "${{ needs.prepare.outputs.head_sha }}"

      - name: Mark handshake blocker
        if: steps.request_agent.outcome == 'failure'
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:blocked

      - name: Dispatch after handshake blocker
        if: steps.request_agent.outcome == 'failure'
        run: python3 apps/github_release_train.py dispatch-next

      - name: Fail handshake job after durable blocker
        if: steps.request_agent.outcome == 'failure'
        run: exit 1

  release_repo_only:
    name: Merge repo-only PR
    needs:
      - select
      - prepare
    if: >-
      needs.prepare.outputs.scope == 'scope:repo-only' &&
      needs.prepare.outputs.task_class == 'task:standard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_ORCHESTRATION_REQUIRED: ${{ vars.WB_CORE_ORCHESTRATION_REQUIRED }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Merge exact checked PR head
        id: merge
        run: >-
          python3 apps/github_release_train.py merge
          --pr "${{ needs.select.outputs.pr_number }}"
          --expected-head-sha "${{ needs.prepare.outputs.head_sha }}"
          --head-ref "${{ needs.prepare.outputs.head_ref }}"
          --scope "${{ needs.prepare.outputs.scope }}"
          --task-class "${{ needs.prepare.outputs.task_class }}"
          --loop-root "${{ needs.prepare.outputs.loop_root }}"
          --output-path "$GITHUB_OUTPUT"

      - name: Mark repo-only completion
        if: steps.merge.outputs.skip_release != 'true'
        run: >-
          python3 apps/github_release_train.py complete-standard
          --pr "${{ needs.select.outputs.pr_number }}"
          --merge-sha "${{ steps.merge.outputs.merge_sha }}"
          --contour repo-only

      - name: Delete merged feature branch
        if: always() && steps.merge.outputs.merge_sha != ''
        continue-on-error: true
        run: >-
          python3 apps/github_release_train.py cleanup-branch
          --pr "${{ needs.select.outputs.pr_number }}"

      - name: Mark merge blocker
        if: failure() && steps.merge.outputs.merge_sha == ''
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:blocked

      - name: Continue release queue
        if: always()
        run: python3 apps/github_release_train.py dispatch-next

  release_live:
    name: Merge and deploy live PR
    needs:
      - select
      - prepare
    if: >-
      needs.prepare.outputs.scope == 'scope:live-runtime' &&
      (needs.prepare.outputs.task_class == 'task:standard' ||
      needs.prepare.outputs.agent_acknowledged == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WB_CORE_ORCHESTRATION_REQUIRED: ${{ vars.WB_CORE_ORCHESTRATION_REQUIRED }}
      WB_CORE_DEPLOY_SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
      WB_CORE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check production secret binding
        run: >-
          python3 apps/github_release_train.py preflight-deploy
          --pr "${{ needs.select.outputs.pr_number }}"

      - name: Configure production SSH
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/wb-core-release-key"
          known_hosts_file="$RUNNER_TEMP/wb-core-known-hosts"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$WB_CORE_DEPLOY_SSH_KEY" > "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$WB_CORE_DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          install -d -m 700 "$HOME/.ssh"
          target_host="$(python3 -c 'import json; print(json.load(open("artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json"))["host_ip"])')"
          target_alias="$(python3 -c 'import json; print(json.load(open("artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json"))["ssh_destination"])')"
          config_file="$HOME/.ssh/config"
          install -m 600 /dev/null "$config_file"
          printf 'Host %s\n  HostName %s\n  User root\n  IdentityFile %s\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s\n' \
            "$target_alias" "$target_host" "$key_file" "$known_hosts_file" > "$config_file"
          echo "WB_CORE_RELEASE_SSH_ALIAS=$target_alias" >> "$GITHUB_ENV"

      - name: Verify production SSH before merge
        run: ssh "$WB_CORE_RELEASE_SSH_ALIAS" true

      - name: Merge exact checked PR head
        id: merge
        run: >-
          python3 apps/github_release_train.py merge
          --pr "${{ needs.select.outputs.pr_number }}"
          --expected-head-sha "${{ needs.prepare.outputs.head_sha }}"
          --head-ref "${{ needs.prepare.outputs.head_ref }}"
          --scope "${{ needs.prepare.outputs.scope }}"
          --task-class "${{ needs.prepare.outputs.task_class }}"
          --loop-root "${{ needs.prepare.outputs.loop_root }}"
          --output-path "$GITHUB_OUTPUT"

      - name: Checkout exact merge SHA
        if: steps.merge.outputs.skip_release != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.merge.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install deploy-runner dependencies
        if: steps.merge.outputs.skip_release != 'true'
        run: >-
          python3 -m pip install --disable-pip-version-check
          openpyxl==3.1.5 xlrd==2.0.1 playwright==1.58.0
          pypdf==6.4.1 reportlab==4.4.5

      - name: Deploy and verify exact merge SHA
        if: steps.merge.outputs.skip_release != 'true'
        env:
          WB_CORE_RELEASE_PR: ${{ needs.select.outputs.pr_number }}
          WB_CORE_RELEASE_HEAD: ${{ needs.prepare.outputs.head_sha }}
        run: >-
          python3 apps/registry_upload_http_entrypoint_hosted_runtime.py deploy-and-verify
          --output "$RUNNER_TEMP/wb-core-deploy-evidence.json"

      - name: Read back exact deployed SHA
        if: >-
          steps.merge.outputs.skip_release != 'true' &&
          needs.prepare.outputs.task_class == 'task:standard' &&
          needs.prepare.outputs.dcp_handoff == 'true'
        run: >-
          python3 apps/hosted_runtime_transport_reconcile.py
          --target-file artifacts/registry_upload_http_entrypoint/input/hosted_runtime_target__europe_api.json
          --expected-sha "${{ steps.merge.outputs.merge_sha }}"
          --pr "${{ needs.select.outputs.pr_number }}"
          --head "${{ needs.prepare.outputs.head_sha }}"
          --merge "${{ steps.merge.outputs.merge_sha }}"
          --failed-stage readback
          --read-only
          --output "$RUNNER_TEMP/wb-core-runtime-evidence.json"

      - name: Mark ordinary production completion
        if: >-
          steps.merge.outputs.skip_release != 'true' &&
          needs.prepare.outputs.task_class == 'task:standard' &&
          needs.prepare.outputs.dcp_handoff != 'true'
        run: >-
          python3 apps/github_release_train.py complete-standard
          --pr "${{ needs.select.outputs.pr_number }}"
          --merge-sha "${{ steps.merge.outputs.merge_sha }}"
          --contour production-verified

      - name: Mark DCP exact production completion
        if: >-
          steps.merge.outputs.skip_release != 'true' &&
          needs.prepare.outputs.task_class == 'task:standard' &&
          needs.prepare.outputs.dcp_handoff == 'true'
        run: >-
          python3 apps/github_release_train.py complete-standard
          --pr "${{ needs.select.outputs.pr_number }}"
          --merge-sha "${{ steps.merge.outputs.merge_sha }}"
          --contour production-verified
          --deploy-evidence-file "$RUNNER_TEMP/wb-core-deploy-evidence.json"
          --runtime-evidence-file "$RUNNER_TEMP/wb-core-runtime-evidence.json"

      - name: Open production UI gate for LOOP
        if: >-
          needs.prepare.outputs.task_class == 'task:loop'
        run: >-
          python3 apps/github_release_train.py await-ui
          --pr "${{ needs.select.outputs.pr_number }}"
          --merge-sha "${{ steps.merge.outputs.merge_sha }}"

      - name: Delete merged feature branch
        if: always() && steps.merge.outputs.merge_sha != ''
        continue-on-error: true
        run: >-
          python3 apps/github_release_train.py cleanup-branch
          --pr "${{ needs.select.outputs.pr_number }}"

      - name: Mark pre-merge blocker
        if: failure() && steps.merge.outputs.merge_sha == ''
        run: >-
          python3 apps/github_release_train.py transition
          --pr "${{ needs.select.outputs.pr_number }}"
          --state release:blocked

      - name: Halt queue after merged release failure
        if: >-
          steps.merge.outputs.merge_sha != '' &&
          steps.merge.outputs.skip_release != 'true' &&
          failure()
        run: >-
          python3 apps/github_release_train.py halt-merged
          --pr "${{ needs.select.outputs.pr_number }}"
          --merge-sha "${{ steps.merge.outputs.merge_sha }}"
          --reason "deploy or production verify did not complete successfully"

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wb-core-release-key" "$RUNNER_TEMP/wb-core-known-hosts" "$HOME/.ssh/config"

      - name: Continue release queue
        if: >-
          always() &&
          ((success() && needs.prepare.outputs.task_class == 'task:standard') ||
          (failure() && steps.merge.outputs.merge_sha == ''))
        run: python3 apps/github_release_train.py dispatch-next
