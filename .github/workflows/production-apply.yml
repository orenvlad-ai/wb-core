name: Production Apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview, apply or read back one exact operation
        required: true
        type: choice
        options: [preview, apply, readback]
      adapter:
        description: Registered domain adapter
        required: true
        type: string
      operation_id:
        description: Stable operation identity
        required: true
        type: string
      request_json:
        description: Adapter-specific request without secrets
        required: true
        default: "{}"
        type: string
      expected_prestate:
        description: Exact sha256 from preview; required for apply
        required: false
        type: string
      expected_candidate:
        description: Exact sha256 from preview; required for apply
        required: false
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: One exact production operation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Run registered adapter once
        env:
          WB_CORE_DEPLOY_SSH_KEY: ${{ secrets.WB_CORE_DEPLOY_SSH_KEY }}
          WB_CORE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WB_CORE_DEPLOY_KNOWN_HOSTS }}
          APPLY_ACTION: ${{ inputs.action }}
          APPLY_ADAPTER: ${{ inputs.adapter }}
          APPLY_OPERATION_ID: ${{ inputs.operation_id }}
          APPLY_EXPECTED_PRESTATE: ${{ inputs.expected_prestate }}
          APPLY_EXPECTED_CANDIDATE: ${{ inputs.expected_candidate }}
        run: |
          set -euo pipefail
          request_json="$(
            python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["inputs"]["request_json"])'
          )"
          python3 apps/production_apply_launcher.py "$APPLY_ACTION" \
            --adapter "$APPLY_ADAPTER" \
            --operation-id "$APPLY_OPERATION_ID" \
            --request-json "$request_json" \
            --expected-prestate "$APPLY_EXPECTED_PRESTATE" \
            --expected-candidate "$APPLY_EXPECTED_CANDIDATE" \
            --output "$RUNNER_TEMP/production-apply-receipt.json"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/production-apply-receipt.json
          if-no-files-found: warn
          retention-days: 90
