<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --panel: #171923;
      --panel-2: #1e2230;
      --control: #10131b;
      --border: rgba(177, 139, 255, 0.22);
      --text: #f2f4ff;
      --muted: #aab0c5;
      --accent: #a78bfa;
      --danger: #fb7185;
      --success: #34d399;
      --warning: #facc15;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
    main { padding: 24px; }
    .shell { max-width: 1440px; margin: 0 auto; display: grid; gap: 18px; }
    .topbar, .block { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 26px; }
    h2 { font-size: 18px; }
    p { margin: 6px 0 0; color: var(--muted); }
    button, .button-link {
      min-height: 36px; border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px;
      color: var(--text); background: var(--panel-2); font: inherit; font-weight: 800; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    button.primary { background: linear-gradient(135deg, #7c3aed, #2563eb); border-color: transparent; }
    button.danger { border-color: rgba(251, 113, 133, 0.55); color: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .message { min-height: 20px; margin: 0; font-size: 13px; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 12px; }
    table { width: 100%; min-width: 1180px; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 9px; border-bottom: 1px solid rgba(177, 139, 255, 0.14); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; z-index: 1; background: #171923; color: var(--muted); font-size: 12px; text-transform: uppercase; }
    th.col-active { width: 58px; }
    th.col-nmid { width: 118px; }
    th.col-name { width: 220px; }
    th.col-type { width: 150px; }
    th.col-match { width: 220px; }
    th.col-price { width: 138px; }
    th.col-models { width: 260px; }
    th.col-updated { width: 174px; }
    th.col-actions { width: 96px; }
    input, select, textarea {
      width: 100%; min-height: 34px; border: 1px solid rgba(177, 139, 255, 0.28); border-radius: 6px;
      padding: 7px 8px; background: var(--control); color: var(--text); font: inherit;
    }
    textarea { min-height: 38px; resize: vertical; }
    .models-textarea { min-height: 38px; max-height: 82px; resize: vertical; }
    .type-select { min-width: 126px; }
    .price-input { min-width: 112px; }
    .checkbox-cell { text-align: center; }
    .checkbox-cell input { width: 18px; min-height: 18px; }
    .narrow { min-width: 82px; }
    .wide { min-width: 180px; }
    .muted-row { opacity: .58; }
    .compat-keys { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .compat-keys summary { cursor: pointer; width: fit-content; }
    .compat-keys div { margin-top: 4px; max-height: 64px; overflow: auto; word-break: break-word; }
    .actions-cell { display: flex; align-items: center; gap: 6px; }
    .icon-button { width: 34px; min-width: 34px; min-height: 32px; padding: 0; border-radius: 7px; font-size: 16px; line-height: 1; }
    .icon-button.save { border-color: rgba(52, 211, 153, .55); color: #03130d; background: var(--success); }
    .icon-button.disable { border-color: rgba(250, 204, 21, .58); color: #211600; background: var(--warning); }
    .file-input { display: none; }
    @media (max-width: 760px) {
      main { padding: 16px; }
      button, .button-link { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="shell">
      <section class="topbar">
        <div>
          <h1>Настройки</h1>
          <p>Server-side настройки WebCore</p>
        </div>
        <div class="toolbar">
          <a id="vitrinaLink" class="button-link" href="/sheet-vitrina-v1/vitrina">К витрине</a>
          <a id="logoutLink" class="button-link" href="/logout">Выйти</a>
        </div>
      </section>

      <section class="block" aria-labelledby="nomenclatureTitle">
        <div class="toolbar" style="justify-content: space-between;">
          <div>
            <h2 id="nomenclatureTitle">Справочник номенклатуры</h2>
            <p>Сопоставление строк invoice с внутренними SKU/nmId и номенклатурой.</p>
          </div>
          <div class="toolbar">
            <input id="nomenclatureFilter" class="wide" placeholder="Поиск по match key / nmId / номенклатуре / модели">
            <button id="addItemButton" class="primary" type="button">Добавить строку</button>
            <button id="exportNomenclatureButton" type="button">Скачать Excel</button>
            <button id="importNomenclatureButton" type="button">Загрузить Excel</button>
            <input id="importNomenclatureFile" class="file-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
          </div>
        </div>
        <p id="nomenclatureMessage" class="message">Читаем справочник...</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-active">Вкл.</th>
                <th class="col-nmid">nmId</th>
                <th class="col-name">Номенклатура</th>
                <th class="col-type">Тип</th>
                <th class="col-match">Match key</th>
                <th class="col-price">Цена закупки, ¥</th>
                <th class="col-models">Совместимые модели</th>
                <th class="col-updated">Обновлено</th>
                <th class="col-actions">Действия</th>
              </tr>
            </thead>
            <tbody id="nomenclatureRows">
              <tr><td colspan="9">Справочник пуст.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script id="sheet-vitrina-v1-settings-config" type="application/json">__SHEET_VITRINA_V1_SETTINGS_CONFIG_JSON__</script>
  <script>
    (() => {
      const config = JSON.parse(document.getElementById("sheet-vitrina-v1-settings-config").textContent);
      const nomenclaturePath = config.nomenclature_path;
      const nomenclatureExportPath = config.nomenclature_export_path;
      const nomenclatureImportPath = config.nomenclature_import_path;
      const rowsBody = document.getElementById("nomenclatureRows");
      const message = document.getElementById("nomenclatureMessage");
      const filterInput = document.getElementById("nomenclatureFilter");
      const addItemButton = document.getElementById("addItemButton");
      const exportButton = document.getElementById("exportNomenclatureButton");
      const importButton = document.getElementById("importNomenclatureButton");
      const importFileInput = document.getElementById("importNomenclatureFile");
      const logoutLink = document.getElementById("logoutLink");
      const vitrinaLink = document.getElementById("vitrinaLink");

      const productTypeLabels = {
        clear: "Прозрачное",
        anti_spy: "Антишпион",
        matte: "Матовое",
        extra: "Доп. строка",
        other: "Другое"
      };
      let items = [];

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
        }[char]));
      }

      function setMessage(text, tone) {
        message.textContent = text || "";
        message.className = "message" + (tone ? " " + tone : "");
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options || {});
        const contentType = response.headers.get("content-type") || "";
        const text = await response.text();
        if (!contentType.toLowerCase().includes("application/json")) {
          const preview = text.replace(/\s+/g, " ").trim().slice(0, 220);
          throw new Error("HTTP " + response.status + " " + response.url + " returned non-JSON " + (contentType || "content-type") + (preview ? ": " + preview : ""));
        }
        const payload = text ? JSON.parse(text) : {};
        if (!response.ok) {
          const rowErrors = Array.isArray(payload.errors) ? payload.errors.map((item) => item.message || String(item)).join("; ") : "";
          throw new Error(payload.error || rowErrors || ("HTTP " + response.status));
        }
        return payload;
      }

      async function loadItems() {
        setMessage("Читаем справочник...", "");
        try {
          const payload = await fetchJson(nomenclaturePath, { headers: { Accept: "application/json" } });
          items = Array.isArray(payload.items) ? payload.items : [];
          renderRows();
          setMessage("", "");
        } catch (error) {
          setMessage(error.message, "error");
        }
      }

      function renderRows() {
        const query = filterInput.value.trim().toLowerCase();
        const visible = query ? items.filter((item) => itemText(item).includes(query)) : items;
        if (!visible.length) {
          rowsBody.innerHTML = '<tr><td colspan="9">Справочник пуст.</td></tr>';
          return;
        }
        rowsBody.innerHTML = visible.map(renderRow).join("");
        Array.from(rowsBody.querySelectorAll("[data-save-item]")).forEach((button) => {
          button.addEventListener("click", () => saveRow(button.closest("tr")));
        });
        Array.from(rowsBody.querySelectorAll("[data-disable-item]")).forEach((button) => {
          button.addEventListener("click", () => deactivateRow(button.closest("tr")));
        });
      }

      function itemText(item) {
        return [
          item.match_key, item.nm_id, item.nomenclature_name,
          item.product_type, productTypeLabels[item.product_type] || "",
          item.compatible_models_text, (item.compatible_model_keys || []).join(" ")
        ].join(" ").toLowerCase();
      }

      function renderRow(item) {
        const compatibleKeys = Array.isArray(item.compatible_model_keys) ? item.compatible_model_keys : [];
        const rowClass = item.is_active ? "" : ' class="muted-row"';
        return [
          '<tr data-item-id="' + escapeHtml(item.item_id || "") + '"' + rowClass + '>',
          '<td class="checkbox-cell"><input type="checkbox" data-field="is_active"' + (item.is_active ? " checked" : "") + '></td>',
          '<td><input class="narrow" data-field="nm_id" value="' + escapeHtml(item.nm_id ?? "") + '"></td>',
          '<td><input class="wide" data-field="nomenclature_name" value="' + escapeHtml(item.nomenclature_name || "") + '"></td>',
          '<td><select class="type-select" data-field="product_type">' + productTypeOptions(item.product_type || "clear") + '</select></td>',
          '<td><input class="wide" data-field="match_key" value="' + escapeHtml(item.match_key || "") + '"></td>',
          '<td><input class="price-input" data-field="purchase_price_yuan" inputmode="decimal" value="' + escapeHtml(item.purchase_price_yuan ?? "") + '"></td>',
          '<td><textarea class="models-textarea" data-field="compatible_models_text" placeholder="Например: iPhone 17e, iPhone 16e, iPhone 14">' + escapeHtml(item.compatible_models_text || "") + '</textarea>' + renderCompatibleKeys(compatibleKeys) + '</td>',
          '<td>' + escapeHtml(item.updated_at || "-") + '</td>',
          '<td><div class="actions-cell"><button class="icon-button save" type="button" data-save-item title="Сохранить" aria-label="Сохранить">✓</button><button class="icon-button disable" type="button" data-disable-item title="Выключить" aria-label="Выключить">⏸</button></div></td>',
          '</tr>'
        ].join("");
      }

      function renderCompatibleKeys(keys) {
        const label = keys.length ? ("Ключи: " + keys.length) : "Ключи совместимости";
        const body = keys.length ? keys.map((key) => '<div>' + escapeHtml(key) + '</div>').join("") : '<div>-</div>';
        return '<details class="compat-keys"><summary>' + escapeHtml(label) + '</summary>' + body + '</details>';
      }

      function productTypeOptions(value) {
        return ["clear", "anti_spy", "matte", "extra", "other"].map((item) => (
          '<option value="' + item + '"' + (item === value ? " selected" : "") + '>' + escapeHtml(productTypeLabels[item] || item) + '</option>'
        )).join("");
      }

      function readRow(row) {
        const payload = {};
        Array.from(row.querySelectorAll("[data-field]")).forEach((input) => {
          const key = input.dataset.field;
          payload[key] = input.type === "checkbox" ? input.checked : input.value.trim();
        });
        payload.compatible_models_text = String(payload.compatible_models_text || "").trim();
        if (payload.nm_id === "") {
          payload.nm_id = null;
        }
        if (payload.purchase_price_yuan === "") {
          payload.purchase_price_yuan = null;
        }
        return payload;
      }

      function validateRow(payload) {
        if (payload.is_active && ["clear", "anti_spy", "matte"].includes(payload.product_type)) {
          if (!payload.match_key) {
            return "Для active product строки нужен match_key.";
          }
          if (!payload.nomenclature_name) {
            return "Для active product строки нужна номенклатура.";
          }
        }
        if (payload.purchase_price_yuan !== null) {
          const numberValue = Number(String(payload.purchase_price_yuan).replace(",", "."));
          if (!Number.isFinite(numberValue) || numberValue < 0) {
            return "Цена закупки, ¥ должна быть числом >= 0.";
          }
        }
        return "";
      }

      async function saveRow(row) {
        const payload = readRow(row);
        const validationError = validateRow(payload);
        if (validationError) {
          setMessage(validationError, "error");
          return;
        }
        const itemId = row.dataset.itemId || "";
        const isNew = !itemId;
        const url = isNew ? nomenclaturePath : nomenclaturePath + "/" + encodeURIComponent(itemId);
        setMessage("Сохраняем строку справочника...", "");
        try {
          await fetchJson(url, {
            method: isNew ? "POST" : "PATCH",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(payload)
          });
          await loadItems();
          setMessage("Справочник сохранён.", "success");
        } catch (error) {
          setMessage(error.message, "error");
        }
      }

      async function deactivateRow(row) {
        const itemId = row.dataset.itemId || "";
        if (!itemId) {
          row.remove();
          return;
        }
        if (!confirm("Выключить строку справочника?")) {
          return;
        }
        setMessage("Выключаем строку...", "");
        try {
          await fetchJson(nomenclaturePath + "/" + encodeURIComponent(itemId), { method: "DELETE", headers: { Accept: "application/json" } });
          await loadItems();
          setMessage("Строка выключена.", "success");
        } catch (error) {
          setMessage(error.message, "error");
        }
      }

      async function downloadNomenclature() {
        setMessage("Готовим Excel...", "");
        try {
          const response = await fetch(nomenclatureExportPath, { headers: { Accept: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" } });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text.replace(/\s+/g, " ").trim().slice(0, 220) || ("HTTP " + response.status));
          }
          const blob = await response.blob();
          const href = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = href;
          link.download = "nomenclature.xlsx";
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(href);
          setMessage("Excel скачан.", "success");
        } catch (error) {
          setMessage(error.message, "error");
        }
      }

      async function uploadNomenclature(file) {
        if (!file) {
          return;
        }
        const formData = new FormData();
        formData.append("file", file, file.name || "nomenclature.xlsx");
        setMessage("Загружаем Excel...", "");
        try {
          const payload = await fetchJson(nomenclatureImportPath, { method: "POST", body: formData, headers: { Accept: "application/json" } });
          await loadItems();
          setMessage(
            "Импорт: создано " + payload.created_count + ", обновлено " + payload.updated_count + ", выключено " + payload.deactivated_count + ", пропущено " + payload.skipped_count + ".",
            "success"
          );
        } catch (error) {
          setMessage(error.message, "error");
        } finally {
          importFileInput.value = "";
        }
      }

      addItemButton.addEventListener("click", () => {
        const draft = {
          item_id: "",
          is_active: true,
          nm_id: null,
          nomenclature_name: "",
          product_type: "clear",
          match_key: "",
          purchase_price_yuan: null,
          compatible_models_text: "",
          compatible_model_keys: [],
          updated_at: "-"
        };
        rowsBody.insertAdjacentHTML("afterbegin", renderRow(draft));
        const row = rowsBody.querySelector("tr[data-item-id='']");
        row.querySelector("[data-save-item]").addEventListener("click", () => saveRow(row));
        row.querySelector("[data-disable-item]").addEventListener("click", () => deactivateRow(row));
        setMessage("", "");
      });
      exportButton.addEventListener("click", downloadNomenclature);
      importButton.addEventListener("click", () => importFileInput.click());
      importFileInput.addEventListener("change", () => uploadNomenclature(importFileInput.files && importFileInput.files[0]));
      filterInput.addEventListener("input", renderRows);
      if (logoutLink && config.logout_path) {
        logoutLink.href = config.logout_path;
      }
      if (vitrinaLink && config.vitrina_path) {
        vitrinaLink.href = config.vitrina_path;
      }
      loadItems();
    })();
  </script>
</body>
</html>
