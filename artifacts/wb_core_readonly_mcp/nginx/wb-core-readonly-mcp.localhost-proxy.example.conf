# Example reverse-proxy block for wb-core-readonly-mcp.
#
# This is intentionally not a product-plane API route.
# Use a dedicated authenticated hostname/tunnel and keep the app bound to
# 127.0.0.1:8766. Do not install this into a broad catch-all server block.

server {
    listen 443 ssl;
    server_name readonly-mcp.example.invalid;

    # TLS cert/key paths are deployment-specific and must not be committed.
    ssl_certificate /etc/letsencrypt/live/readonly-mcp.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/readonly-mcp.example.invalid/privkey.pem;

    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8766/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /sse {
        proxy_pass http://127.0.0.1:8766/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8766/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
